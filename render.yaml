services:
  - type: web
    name: marksense-web
    runtime: docker
    dockerfilePath: ./chinese-ocr-app/Dockerfile
    dockerContext: ./chinese-ocr-app
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: PRIMARY_LLM
        value: gemini
      - key: SEARCH_METHOD
        value: api
      - key: SEARCH_ALLOW_API_FALLBACK
        value: true
      - key: ENABLE_SELENIUM_IMAGE_SEARCH
        value: false
      - key: ENABLE_GOOGLE_IMAGE_HTTP_UPLOAD
        value: false
      - key: ENABLE_SERPAPI_IMAGE_SEARCH
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_CX
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: APP_PUBLIC_BASE_URL
        sync: false
      - key: CONTACT_SMTP_USER
        sync: false
      - key: CONTACT_SMTP_PASSWORD
        sync: false
