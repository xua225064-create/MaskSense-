name: Build HieuDe Mobile Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - nckh
      - main
      - master
    paths:
      - hieude_mobile/**
      - .github/workflows/hieude-mobile-ios.yml

concurrency:
  group: hieude-mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hieude_mobile/package-lock.json

      - name: Install dependencies
        working-directory: hieude_mobile
        run: npm ci

      - name: Generate native iOS project
        working-directory: hieude_mobile
        run: npx --yes expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        working-directory: hieude_mobile/ios
        run: pod install

      - name: Build iOS app without code signing
        working-directory: hieude_mobile
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | ruby -rjson -e 'data=JSON.parse(STDIN.read); puts data.dig("workspace","schemes").find { |s| s != "Pods" }')"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: hieude_mobile
        run: |
          set -euo pipefail
          APP_PATH="$(find build/ios-derived/Build/Products/Release-iphoneos -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf unsigned-ipa
          mkdir -p unsigned-ipa/Payload
          cp -R "$APP_PATH" unsigned-ipa/Payload/
          (cd unsigned-ipa && zip -qry ../marksense-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: marksense-unsigned-ipa
          path: hieude_mobile/marksense-unsigned.ipa
