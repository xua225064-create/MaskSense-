name: Build HieuDe Mobile Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - nckh
      - main
      - master
    paths:
      - hieude_mobile/**
      - .github/workflows/hieude-mobile-ios.yml

concurrency:
  group: hieude-mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hieude_mobile/package-lock.json

      - name: Install dependencies
        working-directory: hieude_mobile
        run: npm ci

      - name: Generate native iOS project
        working-directory: hieude_mobile
        run: npx --yes expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        working-directory: hieude_mobile/ios
        run: pod install

      - name: Build iOS app without code signing
        working-directory: hieude_mobile
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          SCHEME_FILE="$(find ios -path '*/xcshareddata/xcschemes/*.xcscheme' ! -path '*/Pods/*' -print -quit)"
          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
          echo "Using workspace: $WORKSPACE"
          echo "Using app scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            build

      - name: Package unsigned IPA
        working-directory: hieude_mobile
        run: |
          set -euo pipefail
          echo "Looking for built .app bundle..."
          find build ios -name '*.app' -print || true
          APP_PATH="$(find build ios -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found. Build output directories:"
            find build -maxdepth 5 -type d -print || true
            exit 1
          fi
          echo "Packaging $APP_PATH"
          rm -rf unsigned-ipa
          mkdir -p unsigned-ipa/Payload
          cp -R "$APP_PATH" unsigned-ipa/Payload/
          (cd unsigned-ipa && zip -qry ../marksense-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: marksense-unsigned-ipa
          path: hieude_mobile/marksense-unsigned.ipa
