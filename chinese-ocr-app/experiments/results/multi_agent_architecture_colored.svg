<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1420" viewBox="0 0 1120 1420">
  <defs>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #0f1f48; }
      .caption { font: 600 20px Georgia, 'Times New Roman', serif; fill: #111827; }
      .box-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #111827; }
      .box-text { font: 12.2px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .small { font: 11.5px Arial, Helvetica, sans-serif; fill: #374151; }
      .label { font: 700 13px Arial, Helvetica, sans-serif; fill: #374151; }
      .white { fill: #ffffff; }
      .blue-box { fill: #f3f8ff; stroke: #2f7de1; stroke-width: 2.2; }
      .green-box { fill: #f2fbf4; stroke: #2e8f43; stroke-width: 2.2; }
      .purple-box { fill: #faf5ff; stroke: #8b46d9; stroke-width: 2.2; }
      .orange-box { fill: #fff8ed; stroke: #f0a431; stroke-width: 2.2; }
      .pink-box { fill: #fff3f7; stroke: #e9447d; stroke-width: 2.2; }
      .gray-box { fill: #f8fafc; stroke: #64748b; stroke-width: 2.2; }
      .dash { fill: none; stroke: #f0a431; stroke-width: 2; stroke-dasharray: 9 7; }
      .arrow { fill: none; stroke: #222; stroke-width: 2.1; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #444; stroke-width: 1.9; marker-end: url(#arrow); }
      .arrow-red { fill: none; stroke: #ef4444; stroke-width: 2.1; stroke-dasharray: 7 6; marker-end: url(#arrow-red); }
      .yes { font: 700 13px Arial, Helvetica, sans-serif; fill: #17843a; }
      .no { font: 700 13px Arial, Helvetica, sans-serif; fill: #dc2626; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#222"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1120" height="1420" fill="#ffffff"/>
  <text x="560" y="50" text-anchor="middle" class="title">Multi-Agent Ceramic Reign Mark Identification System Architecture</text>

  <!-- Input -->
  <rect x="395" y="82" width="330" height="82" rx="10" class="blue-box" filter="url(#shadow)"/>
  <circle cx="438" cy="123" r="26" fill="#2f7de1"/>
  <text x="438" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">IMG</text>
  <text x="485" y="115" class="box-title">Input Image</text>
  <text x="485" y="137" class="box-text">User uploads ceramic mark image</text>

  <path d="M560 164 L560 203" class="arrow"/>

  <!-- Preprocessing -->
  <rect x="375" y="203" width="370" height="92" rx="10" class="orange-box" filter="url(#shadow)"/>
  <circle cx="420" cy="249" r="26" fill="#f0a431"/>
  <text x="420" y="254" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#fff">PRE</text>
  <text x="468" y="238" class="box-title">Image Preprocessing</text>
  <text x="468" y="260" class="box-text">Crop ROI, enhance contrast, reduce noise</text>
  <text x="468" y="279" class="box-text">Normalize image before parallel analysis</text>

  <!-- Branches -->
  <path d="M560 295 L560 325 L220 325 L220 363" class="arrow"/>
  <path d="M560 295 L560 363" class="arrow"/>
  <path d="M560 295 L560 325 L900 325 L900 363" class="arrow"/>

  <!-- Agents top -->
  <rect x="70" y="363" width="300" height="130" rx="10" class="blue-box" filter="url(#shadow)"/>
  <circle cx="114" cy="426" r="28" fill="#2f7de1"/>
  <text x="114" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">OCR</text>
  <text x="160" y="393" class="box-title">Agent 1: OCR</text>
  <text x="160" y="416" class="box-text">OCR variants</text>
  <text x="160" y="437" class="box-text">Visible mark text</text>
  <text x="160" y="458" class="box-text">Candidate strings</text>

  <rect x="410" y="363" width="300" height="130" rx="10" class="purple-box" filter="url(#shadow)"/>
  <circle cx="454" cy="426" r="28" fill="#8b46d9"/>
  <text x="454" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">V</text>
  <text x="500" y="397" class="box-title">Agent 2: Vision AI</text>
  <text x="500" y="420" class="box-text">Direct image reading</text>
  <text x="500" y="441" class="box-text">Seal-script interpretation</text>
  <text x="500" y="462" class="box-text">Vision candidates</text>

  <rect x="750" y="363" width="300" height="130" rx="10" class="green-box" filter="url(#shadow)"/>
  <circle cx="794" cy="426" r="28" fill="#2e8f43"/>
  <text x="794" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">ML</text>
  <text x="840" y="393" class="box-title">Agent 3: Visual Match</text>
  <text x="840" y="416" class="box-text">ORB feature matching</text>
  <text x="840" y="437" class="box-text">Reference library lookup</text>
  <text x="840" y="458" class="box-text">Visual candidates</text>

  <!-- Candidate boxes -->
  <path d="M220 493 L220 535" class="arrow"/>
  <path d="M560 493 L560 535" class="arrow"/>
  <path d="M900 493 L900 535" class="arrow"/>

  <rect x="105" y="535" width="230" height="62" rx="6" class="gray-box"/>
  <text x="220" y="560" text-anchor="middle" class="box-title">OCR Candidates</text>
  <text x="220" y="580" text-anchor="middle" class="small">raw text + corrected variants</text>

  <rect x="445" y="535" width="230" height="62" rx="6" class="gray-box"/>
  <text x="560" y="560" text-anchor="middle" class="box-title">Vision Candidates</text>
  <text x="560" y="580" text-anchor="middle" class="small">direct mark readings</text>

  <rect x="785" y="535" width="230" height="62" rx="6" class="gray-box"/>
  <text x="900" y="560" text-anchor="middle" class="box-title">Visual Match Candidates</text>
  <text x="900" y="580" text-anchor="middle" class="small">reference image matches</text>

  <!-- Specialist area -->
  <rect x="92" y="662" width="936" height="298" rx="14" class="dash"/>
  <rect x="352" y="620" width="416" height="38" rx="8" fill="#fff8ed" stroke="#f0a431" stroke-width="2"/>
  <text x="560" y="645" text-anchor="middle" class="box-title">Specialist AI Modules and Evidence Processing</text>

  <path d="M220 597 C220 650, 315 676, 395 704" class="arrow-soft"/>
  <path d="M560 597 L560 694" class="arrow-soft"/>
  <path d="M900 597 C900 650, 805 676, 725 704" class="arrow-soft"/>

  <rect x="135" y="700" width="260" height="190" rx="10" class="blue-box" filter="url(#shadow)"/>
  <circle cx="178" cy="752" r="27" fill="#2f7de1"/>
  <text x="178" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">DB</text>
  <text x="220" y="724" class="box-title">Database Matching</text>
  <text x="220" y="747" class="box-text">Ceramic mark database</text>
  <text x="220" y="768" class="box-text">Fuzzy text matching</text>
  <text x="220" y="789" class="box-text">Similar-glyph correction</text>
  <text x="220" y="810" class="box-text">Metadata candidates</text>

  <rect x="430" y="700" width="260" height="190" rx="10" class="purple-box" filter="url(#shadow)"/>
  <circle cx="473" cy="752" r="27" fill="#8b46d9"/>
  <text x="473" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">SEM</text>
  <text x="515" y="728" class="box-title">Semantic Analysis</text>
  <text x="515" y="751" class="box-text">Interpret mark meaning</text>
  <text x="515" y="772" class="box-text">Infer dynasty / reign title</text>
  <text x="515" y="793" class="box-text">Check historical consistency</text>
  <text x="515" y="814" class="box-text">Limit unsupported output</text>

  <rect x="725" y="700" width="260" height="190" rx="10" class="green-box" filter="url(#shadow)"/>
  <circle cx="768" cy="752" r="27" fill="#2e8f43"/>
  <text x="768" y="758" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#fff">WEB</text>
  <text x="810" y="728" class="box-title">Web Evidence</text>
  <text x="810" y="751" class="box-text">Search trusted sources</text>
  <text x="810" y="772" class="box-text">Collect titles and URLs</text>
  <text x="810" y="793" class="box-text">Filter weak evidence</text>
  <text x="810" y="814" class="box-text">Supporting sources</text>

  <!-- Voting -->
  <path d="M265 890 C265 930, 430 960, 510 990" class="arrow-soft"/>
  <path d="M560 890 L560 980" class="arrow-soft"/>
  <path d="M855 890 C855 930, 690 960, 610 990" class="arrow-soft"/>

  <rect x="360" y="980" width="400" height="96" rx="10" class="orange-box" filter="url(#shadow)"/>
  <circle cx="405" cy="1028" r="27" fill="#f0a431"/>
  <text x="405" y="1034" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">W</text>
  <text x="450" y="1011" class="box-title">Weighted Voting Aggregator</text>
  <text x="450" y="1034" class="box-text">Combine OCR, Vision, database,</text>
  <text x="450" y="1055" class="box-text">visual and web evidence signals</text>

  <path d="M760 1028 C900 1028, 913 908, 842 878" class="arrow-red"/>
  <rect x="835" y="930" width="166" height="54" rx="8" fill="#fff7f7" stroke="#ef4444" stroke-width="1.4"/>
  <text x="918" y="951" text-anchor="middle" class="no">Low confidence</text>
  <text x="918" y="970" text-anchor="middle" class="no">evidence loop</text>

  <path d="M560 1076 L560 1117" class="arrow"/>
  <rect x="390" y="1117" width="340" height="70" rx="10" class="pink-box" filter="url(#shadow)"/>
  <circle cx="433" cy="1152" r="25" fill="#e9447d"/>
  <path d="M424 1163 l9 -24 l9 24 M428 1155 h10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="478" y="1143" class="box-title">Evidence Check</text>
  <text x="478" y="1163" class="box-text">Is the selected result supported</text>
  <text x="478" y="1181" class="box-text">by clear source evidence?</text>

  <path d="M500 1187 C455 1225, 386 1247, 315 1273" class="arrow"/>
  <path d="M620 1187 C665 1225, 734 1247, 805 1273" class="arrow"/>
  <text x="425" y="1230" class="yes">Yes</text>
  <text x="690" y="1230" class="no">No</text>

  <rect x="170" y="1273" width="290" height="72" rx="10" class="green-box" filter="url(#shadow)"/>
  <text x="315" y="1301" text-anchor="middle" class="box-title">Final Verified Report</text>
  <text x="315" y="1324" text-anchor="middle" class="box-text">Mark, metadata, confidence and sources</text>

  <rect x="660" y="1273" width="290" height="72" rx="10" class="gray-box" filter="url(#shadow)"/>
  <text x="805" y="1301" text-anchor="middle" class="box-title">Final Unverified Report</text>
  <text x="805" y="1324" text-anchor="middle" class="box-text">Mark result with insufficient source warning</text>

  <text x="560" y="1392" text-anchor="middle" class="caption">Fig. 1. Multi-agent ceramic reign mark identification workflow.</text>
</svg>
